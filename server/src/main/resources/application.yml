server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: quote-quiz-server
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:quote-quiz;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: ${QUOTEQUIZ_DB_USERNAME:sa}
    password: ${QUOTEQUIZ_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

quotequiz:
  cors:
    allowed-origin-patterns: ${QUOTEQUIZ_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,https://quote-quiz.onrender.com}
  security:
    jwt-secret: ${QUOTEQUIZ_JWT_SECRET:dev-only-jwt-secret-change-me-32chars}
  seed:
    demo-user-password: ${QUOTEQUIZ_DEMO_USER_PASSWORD:password123}
    reviewer-user-password: ${QUOTEQUIZ_REVIEWER_USER_PASSWORD:reviewer123}
