<!DOCTYPE html>

<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quiz Result Overlay</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e4e2e2",
                        "secondary-container": "#e4e2e2",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-low": "#f7f2f8",
                        "surface-container-high": "#ebe7ec",
                        "secondary-fixed-dim": "#c8c6c6",
                        "inverse-on-surface": "#f4eff5",
                        "background": "#fdf8fd",
                        "inverse-primary": "#c0c1ff",
                        "surface": "#fdf8fd",
                        "on-error-container": "#93000a",
                        "surface-tint": "#4f54b4",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#a6a9b4",
                        "surface-container-highest": "#e5e1e7",
                        "outline": "#777683",
                        "surface-variant": "#e5e1e7",
                        "surface-bright": "#fdf8fd",
                        "on-tertiary-fixed": "#181b24",
                        "on-secondary": "#ffffff",
                        "tertiary": "#252831",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1f",
                        "surface-dim": "#ddd9de",
                        "outline-variant": "#c7c5d4",
                        "on-secondary-container": "#656464",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#464652",
                        "tertiary-fixed-dim": "#c4c6d2",
                        "surface-container": "#f1ecf2",
                        "primary-fixed": "#e1e0ff",
                        "on-surface": "#1c1b1f",
                        "inverse-surface": "#313034",
                        "on-tertiary-fixed-variant": "#434750",
                        "primary": "#15157d",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#3b3e47",
                        "primary-container": "#2e3192",
                        "on-primary-fixed-variant": "#373a9b",
                        "on-primary-container": "#9da1ff",
                        "on-primary-fixed": "#04006d",
                        "secondary": "#5e5e5e",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-secondary-fixed-variant": "#474747",
                        "tertiary-fixed": "#e0e2ee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "stack-lg": "2rem",
                        "gutter": "1rem",
                        "margin-tablet": "2.5rem",
                        "stack-sm": "0.5rem",
                        "margin-mobile": "1.25rem"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-quote": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-quote-mobile": ["Playfair Display"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-quote": ["32px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-quote-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden">
<!-- Mock Background (Quiz Screen underneath) -->
<div class="h-full w-full absolute inset-0 opacity-40 pointer-events-none filter blur-sm flex flex-col pt-20 px-margin-mobile">
    <div class="w-full h-1/2 bg-surface-container-highest rounded-xl mb-stack-lg"></div>
    <div class="w-full h-12 bg-surface-container mb-stack-sm rounded"></div>
    <div class="w-full h-12 bg-surface-container mb-stack-sm rounded"></div>
    <div class="w-full h-12 bg-surface-container mb-stack-sm rounded"></div>
</div>
<!-- Overlay / Backdrop -->
<div class="fixed inset-0 bg-[rgba(28,27,31,0.5)] backdrop-blur-sm z-40 flex items-end md:items-center justify-center transition-opacity duration-300">
    <!-- Modal Container (Bottom Sheet on Mobile, Dialog on Web) -->
    <div class="bg-surface w-full md:max-w-md rounded-t-xl md:rounded-xl shadow-[0_4px_24px_rgba(21,21,125,0.15)] flex flex-col overflow-hidden animate-[slideUp_0.3s_ease-out_forwards] md:animate-[fadeInScale_0.3s_ease-out_forwards]">
        <!-- Error Header Banner -->
        <div class="bg-error-container p-stack-lg flex flex-col items-center justify-center relative overflow-hidden">
<span class="material-symbols-outlined text-6xl text-error mb-stack-sm" style="font-variation-settings: 'FILL' 1;">
                    cancel
                </span>
            <h2 class="font-headline-md text-headline-md text-on-error-container text-center">
                Sorry, you are wrong!
            </h2>
            <!-- Decorative background elements -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-error opacity-5 rounded-full"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-error opacity-5 rounded-full"></div>
        </div>
        <!-- Content Area -->
        <div class="p-stack-lg flex flex-col items-center text-center">
            <p class="font-body-md text-body-md text-on-surface-variant mb-stack-sm">
                The right answer is:
            </p>
            <p class="font-display-quote-mobile text-display-quote-mobile md:font-display-quote md:text-display-quote text-on-surface mb-stack-lg">
                Maya Angelou
            </p>
            <!-- Primary Action Button -->
            <button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3 px-6 rounded-full hover:opacity-90 active:scale-[0.98] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                OK
            </button>
        </div>
    </div>
</div>
<style>
    @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
</style>
</body></html>
