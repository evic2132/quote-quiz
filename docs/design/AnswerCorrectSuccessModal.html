<!DOCTYPE html>

<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quiz Result Overlay - Wisdom Trivia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#e4e2e2",
                      "secondary-container": "#e4e2e2",
                      "primary-fixed-dim": "#c0c1ff",
                      "surface-container-low": "#f7f2f8",
                      "surface-container-high": "#ebe7ec",
                      "secondary-fixed-dim": "#c8c6c6",
                      "inverse-on-surface": "#f4eff5",
                      "background": "#fdf8fd",
                      "inverse-primary": "#c0c1ff",
                      "surface": "#fdf8fd",
                      "on-error-container": "#93000a",
                      "surface-tint": "#4f54b4",
                      "error": "#ba1a1a",
                      "on-tertiary-container": "#a6a9b4",
                      "surface-container-highest": "#e5e1e7",
                      "outline": "#777683",
                      "surface-variant": "#e5e1e7",
                      "surface-bright": "#fdf8fd",
                      "on-tertiary-fixed": "#181b24",
                      "on-secondary": "#ffffff",
                      "tertiary": "#252831",
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "on-background": "#1c1b1f",
                      "surface-dim": "#ddd9de",
                      "outline-variant": "#c7c5d4",
                      "on-secondary-container": "#656464",
                      "on-error": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "on-surface-variant": "#464652",
                      "tertiary-fixed-dim": "#c4c6d2",
                      "surface-container": "#f1ecf2",
                      "primary-fixed": "#e1e0ff",
                      "on-surface": "#1c1b1f",
                      "inverse-surface": "#313034",
                      "on-tertiary-fixed-variant": "#434750",
                      "primary": "#15157d",
                      "on-tertiary": "#ffffff",
                      "tertiary-container": "#3b3e47",
                      "primary-container": "#2e3192",
                      "on-primary-fixed-variant": "#373a9b",
                      "on-primary-container": "#9da1ff",
                      "on-primary-fixed": "#04006d",
                      "secondary": "#5e5e5e",
                      "on-secondary-fixed": "#1b1c1c",
                      "on-secondary-fixed-variant": "#474747",
                      "tertiary-fixed": "#e0e2ee"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "stack-md": "1rem",
                      "stack-lg": "2rem",
                      "gutter": "1rem",
                      "margin-tablet": "2.5rem",
                      "stack-sm": "0.5rem",
                      "margin-mobile": "1.25rem"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "display-quote": [
                              "Playfair Display"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "display-quote-mobile": [
                              "Playfair Display"
                      ],
                      "label-lg": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "display-quote": [
                              "32px",
                              {
                                      "lineHeight": "42px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-sm": [
                              "11px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-quote-mobile": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ],
                      "label-lg": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.1px",
                                      "fontWeight": "500"
                              }
                      ]
              }
      },
          },
        }
    </script>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Mock Background Content (to show the overlay works) -->
<div class="flex-1 opacity-20 pointer-events-none filter blur-[2px] transition-all duration-300">
    <header class="bg-background w-full top-0 border-b border-secondary-fixed flex items-center justify-between px-margin-mobile py-stack-sm w-full">
        <div class="flex items-center gap-gutter">
            <span class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity scale-down duration-200 active:scale-95 cursor-pointer" data-icon="menu">menu</span>
        </div>
        <div class="font-display-quote text-display-quote text-primary text-center flex-1">Wisdom Trivia</div>
        <div class="flex items-center gap-gutter">
            <span class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity scale-down duration-200 active:scale-95 cursor-pointer" data-icon="history">history</span>
        </div>
    </header>
    <main class="px-margin-mobile py-stack-lg md:px-margin-tablet max-w-3xl mx-auto flex flex-col gap-stack-lg">
        <div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden">
            <div class="h-full bg-primary w-[75%] rounded-full"></div>
        </div>
        <div class="relative bg-surface rounded-xl p-stack-lg border border-tertiary-fixed text-center flex flex-col gap-stack-md mt-stack-md">
            <div class="absolute -top-6 left-1/2 -translate-x-1/2 text-[80px] font-display-quote text-primary-fixed opacity-30 leading-none select-none">"</div>
            <p class="font-display-quote-mobile text-display-quote-mobile md:font-display-quote md:text-display-quote text-on-surface relative z-10 pt-4">
                Success is not final, failure is not fatal: it is the courage to continue that counts.
            </p>
        </div>
        <div class="flex flex-col gap-stack-sm mt-stack-md">
            <button class="w-full py-4 px-6 rounded-lg border border-outline text-on-surface hover:bg-surface-container-low transition-colors text-left flex items-center justify-between group">
                <span class="font-body-lg text-body-lg">Abraham Lincoln</span>
            </button>
            <button class="w-full py-4 px-6 rounded-lg border-2 border-primary bg-primary-fixed text-primary hover:bg-primary-fixed transition-colors text-left flex items-center justify-between group relative overflow-hidden">
                <span class="font-body-lg text-body-lg relative z-10 font-semibold">Winston Churchill</span>
                <div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </button>
            <button class="w-full py-4 px-6 rounded-lg border border-outline text-on-surface hover:bg-surface-container-low transition-colors text-left flex items-center justify-between group">
                <span class="font-body-lg text-body-lg">Franklin D. Roosevelt</span>
            </button>
            <button class="w-full py-4 px-6 rounded-lg border border-outline text-on-surface hover:bg-surface-container-low transition-colors text-left flex items-center justify-between group">
                <span class="font-body-lg text-body-lg">Theodore Roosevelt</span>
            </button>
        </div>
    </main>
</div>
<!-- OVERLAY -->
<!-- The semi-transparent dark background -->
<div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm z-40 flex items-center justify-center px-margin-mobile md:px-margin-tablet animate-[fadeIn_0.2s_ease-out]">
    <!-- Modal Container -->
    <div class="bg-surface rounded-xl border border-tertiary-fixed p-stack-lg max-w-sm w-full shadow-[0_8px_30px_rgb(21,21,125,0.15)] flex flex-col items-center text-center gap-stack-md transform transition-all duration-300 scale-100 translate-y-0 animate-[slideUp_0.3s_cubic-bezier(0.16,1,0.3,1)]">
        <!-- Icon/Status Indicator -->
        <div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-2">
            <span class="material-symbols-outlined text-[32px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <!-- Headline -->
        <h2 class="font-display-quote-mobile text-display-quote-mobile md:font-display-quote md:text-display-quote text-primary">Correct!</h2>
        <!-- Supporting Text -->
        <p class="font-body-lg text-body-lg text-on-surface-variant">
            The right answer is: <br/>
            <strong class="font-headline-md text-headline-md text-on-surface mt-1 block">Winston Churchill</strong>
        </p>
        <!-- Action Area -->
        <div class="w-full mt-stack-sm">
            <button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg hover:bg-primary/90 active:scale-[0.98] transition-all duration-200">
                OK
            </button>
        </div>
    </div>
</div>
<style>
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
</style>
</body></html>
