<!DOCTYPE html>

<html lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Profile - Wisdom Trivia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e4e2e2",
                        "secondary-container": "#e4e2e2",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-low": "#f7f2f8",
                        "surface-container-high": "#ebe7ec",
                        "secondary-fixed-dim": "#c8c6c6",
                        "inverse-on-surface": "#f4eff5",
                        "background": "#fdf8fd",
                        "inverse-primary": "#c0c1ff",
                        "surface": "#fdf8fd",
                        "on-error-container": "#93000a",
                        "surface-tint": "#4f54b4",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#a6a9b4",
                        "surface-container-highest": "#e5e1e7",
                        "outline": "#777683",
                        "surface-variant": "#e5e1e7",
                        "surface-bright": "#fdf8fd",
                        "on-tertiary-fixed": "#181b24",
                        "on-secondary": "#ffffff",
                        "tertiary": "#252831",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1f",
                        "surface-dim": "#ddd9de",
                        "outline-variant": "#c7c5d4",
                        "on-secondary-container": "#656464",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#464652",
                        "tertiary-fixed-dim": "#c4c6d2",
                        "surface-container": "#f1ecf2",
                        "primary-fixed": "#e1e0ff",
                        "on-surface": "#1c1b1f",
                        "inverse-surface": "#313034",
                        "on-tertiary-fixed-variant": "#434750",
                        "primary": "#15157d",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#3b3e47",
                        "primary-container": "#2e3192",
                        "on-primary-fixed-variant": "#373a9b",
                        "on-primary-container": "#9da1ff",
                        "on-primary-fixed": "#04006d",
                        "secondary": "#5e5e5e",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-secondary-fixed-variant": "#474747",
                        "tertiary-fixed": "#e0e2ee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "stack-lg": "2rem",
                        "gutter": "1rem",
                        "margin-tablet": "2.5rem",
                        "stack-sm": "0.5rem",
                        "margin-mobile": "1.25rem"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-quote": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-quote-mobile": ["Playfair Display"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-quote": ["32px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-quote-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md pb-24">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 border-b border-secondary-fixed flex items-center justify-between px-margin-mobile py-stack-sm sticky z-10">
    <button class="text-primary hover:opacity-80 transition-opacity scale-down duration-200 active:scale-95">
        <span class="material-symbols-outlined" data-icon="menu">menu</span>
    </button>
    <h1 class="font-display-quote-mobile text-display-quote-mobile md:font-display-quote md:text-display-quote text-primary">Wisdom Trivia</h1>
    <button class="text-primary hover:opacity-80 transition-opacity scale-down duration-200 active:scale-95">
        <span class="material-symbols-outlined" data-icon="history">history</span>
    </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile md:px-margin-tablet py-stack-lg max-w-3xl mx-auto w-full flex flex-col items-center">
    <!-- Profile Header -->
    <div class="flex flex-col items-center mb-stack-lg w-full">
        <div class="w-32 h-32 rounded-full overflow-hidden mb-stack-md border border-tertiary-fixed p-1">
            <img class="w-full h-full object-cover rounded-full" data-alt="A refined, modern portrait of an intelligent-looking individual in a subtle, well-lit studio setting. The lighting is soft and high-key, aligning with a light-mode editorial aesthetic. The background is a stark, clean off-white canvas. The mood is sophisticated and intellectual." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCj14bDPMRxENPhZfCAT2hH6bIroxscEOqmUzC4LOVS8SNl8tKx6MUpCIdSmB3zXVCXjs0GNnhzyErUZJUMBfHK4P7V_g1v6xpaQcBmN-GiGoV_hSnjcHniAnkyU_o-gH_5K9ZtYOsYMZws95nQxdFEJWg-Jac6OFXBsHqYUgB8gfdkcYWnn7WLlqo8lK0KFTlHBAsR29tc9OQRFhmfL_jMgHvmTVR8CHfqUrhK8TAoIqL-6JjsAojow"/>
        </div>
        <h2 class="font-headline-md text-headline-md text-primary mb-1">Jane Doe</h2>
        <p class="font-body-md text-body-md text-on-surface-variant">jane.doe@example.com</p>
    </div>
    <!-- Profile Actions/Stats Bento -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md w-full mb-stack-lg">
        <div class="bg-surface-container-low border border-tertiary-fixed p-stack-md flex items-center justify-between hover:bg-surface-container-high transition-colors cursor-pointer">
            <div class="flex items-center gap-stack-md">
                <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="font-label-lg text-label-lg text-on-surface">Total Score</span>
            </div>
            <span class="font-headline-md text-headline-md text-primary">12,450</span>
        </div>
        <div class="bg-surface-container-low border border-tertiary-fixed p-stack-md flex items-center justify-between hover:bg-surface-container-high transition-colors cursor-pointer">
            <div class="flex items-center gap-stack-md">
                <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_library</span>
                <span class="font-label-lg text-label-lg text-on-surface">Quizzes Taken</span>
            </div>
            <span class="font-headline-md text-headline-md text-primary">142</span>
        </div>
        <div class="bg-surface-container-low border border-tertiary-fixed p-stack-md flex items-center justify-between hover:bg-surface-container-high transition-colors cursor-pointer md:col-span-2">
            <div class="flex items-center gap-stack-md">
                <span class="material-symbols-outlined text-primary">edit</span>
                <span class="font-label-lg text-label-lg text-on-surface">Edit Profile Information</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </div>
    </div>
    <!-- Logout Action -->
    <div class="w-full mt-auto pt-stack-lg flex justify-center">
        <button class="flex items-center gap-2 border border-error text-error px-6 py-3 font-label-lg text-label-lg hover:bg-error-container transition-colors duration-200 active:scale-98">
            <span class="material-symbols-outlined" data-icon="logout">logout</span>
            Logout
        </button>
    </div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface fixed bottom-0 w-full z-50 border-t border-secondary-fixed flex justify-around items-center px-4 pb-4 pt-3">
    <button class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-container-high transition-colors scale-down duration-200 active:scale-98">
        <span class="material-symbols-outlined mb-1" data-icon="quiz">quiz</span>
        <span class="font-label-lg text-label-lg">Quiz</span>
    </button>
    <button class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-container-high transition-colors scale-down duration-200 active:scale-98">
        <span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
        <span class="font-label-lg text-label-lg">Settings</span>
    </button>
    <!-- Active Tab -->
    <button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 hover:bg-surface-container-high transition-colors scale-down duration-200 active:scale-98">
        <span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
        <span class="font-label-lg text-label-lg">Profile</span>
    </button>
</nav>
</body></html>
