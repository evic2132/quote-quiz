<!DOCTYPE html>

              "borderRadius": {

              },

        body {

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<!-- Left/Top Editorial Section -->
<div class="md:w-1/2 w-full p-margin-mobile md:p-margin-tablet flex flex-col justify-between bg-surface-container-low border-b md:border-b-0 md:border-r border-secondary-fixed">
    <!-- Top App Bar (Modified for transactional context: no trailing icon/menu) -->
    <header class="w-full flex items-center justify-between pb-stack-lg border-secondary-fixed">
        <h1 class="font-display-quote-mobile md:font-display-quote text-display-quote-mobile md:text-display-quote text-primary flex items-center gap-2">
            <span class="material-symbols-outlined text-3xl" data-icon="auto_stories">auto_stories</span>
            Famous Quote Quiz
        </h1>
    </header>
    <div class="flex-grow flex flex-col justify-center max-w-lg mx-auto relative">
        <!-- Decorative background quote mark -->
        <span class="absolute -top-10 -left-10 text-9xl text-primary-fixed-dim opacity-30 font-display-quote leading-none select-none pointer-events-none">"</span>
        <p class="font-display-quote-mobile md:font-display-quote text-display-quote-mobile md:text-display-quote text-on-background z-10 relative mb-stack-md">
            Words are, of course, the most powerful drug used by mankind.
        </p>
        <p class="font-body-lg text-body-lg text-on-surface-variant z-10 relative italic">
            — Rudyard Kipling
        </p>
    </div>
    <div class="hidden md:block text-on-surface-variant font-label-sm text-label-sm">
        © 2024 Wisdom Trivia. All rights reserved.
    </div>
</div>
<!-- Right/Bottom Login Section -->
<div class="md:w-1/2 w-full p-margin-mobile md:p-margin-tablet flex flex-col justify-center items-center bg-background">
    <div class="w-full max-w-md bg-surface p-stack-lg rounded-xl border border-secondary-fixed-dim relative">
        <h2 class="font-headline-md text-headline-md text-on-background mb-stack-lg text-center">Sign In to Your Account</h2>
        <form action="#" class="space-y-stack-md">
            <!-- Email Field (Error State) -->
            <div>
                <div class="relative">
                    <input class="peer w-full bg-transparent pt-6 pb-2 px-3 border border-[#FF0000] rounded text-on-background focus:outline-none focus:border-[#FF0000] focus:ring-1 focus:ring-[#FF0000] transition-colors" id="email" placeholder=" " type="email" value="invalid-email-format"/>
                    <label class="absolute left-3 top-2 text-label-sm font-label-sm text-[#FF0000] transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-placeholder-shown:text-on-surface-variant peer-focus:top-2 peer-focus:text-label-sm peer-focus:text-[#FF0000]" for="email">
                        Email Address
                    </label>
                </div>
                <p class="font-label-sm text-label-sm text-[#FF0000] mt-stack-sm flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm" data-icon="error">error</span>
                    Invalid email address
                </p>
            </div>
            <!-- Password Field -->
            <div>
                <div class="relative">
                    <input class="peer w-full bg-transparent pt-6 pb-2 px-3 border border-outline rounded text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder=" " type="password"/>
                    <label class="absolute left-3 top-2 text-label-sm font-label-sm text-on-surface-variant transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-placeholder-shown:text-on-surface-variant peer-focus:top-2 peer-focus:text-label-sm peer-focus:text-primary" for="password">
                        Password
                    </label>
                </div>
            </div>
            <!-- Actions -->
            <div class="flex items-center justify-between pt-stack-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input class="form-checkbox rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
                    <span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
                </label>
                <a class="font-label-lg text-label-lg text-primary hover:underline" href="#">Forgot password?</a>
            </div>
            <!-- Login Button (Loading State) -->
            <button class="w-full mt-stack-lg bg-primary text-on-primary font-label-lg text-label-lg py-3 rounded-lg flex items-center justify-center gap-2 opacity-90 cursor-not-allowed" disabled="" type="button">
                <svg class="animate-spin h-5 w-5 text-on-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                </svg>
                Logging in...
            </button>
        </form>
        <p class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? <a class="text-primary font-label-lg text-label-lg hover:underline" href="#">Sign up</a>
        </p>
    </div>
    <div class="md:hidden mt-stack-lg text-on-surface-variant font-label-sm text-label-sm pb-margin-mobile">
        © 2024 Wisdom Trivia.
    </div>
</div>
</body></html>
