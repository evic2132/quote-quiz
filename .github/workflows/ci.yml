name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  detekt:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

      - name: Upload detekt SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify builds and tests
        run: ./gradlew :server:test :app:shared:jvmTest :app:shared:compileCommonMainKotlinMetadata :app:androidApp:assembleDebug :server:bootJar --no-daemon

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - detekt
      - verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: docker build -t quote-quiz-server-ci .
